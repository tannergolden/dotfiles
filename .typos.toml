# --- Spell-check exclusions specific to this repository ---
#
# This file EXTENDS the shared configuration rather than replacing it. The
# standards `ci.yml` resolves `_typos.toml` to a path under RUNNER_TEMP,
# outside this tree, and passes it as `--config`. typos still walks up from
# each file it checks and merges any config it finds on the way, so the
# shared accepted-words list stays in force and this file only adds to it.
# Verified by running both together: with this file present the terminal
# profile stops reporting and no shared word starts reporting.
#
# Copying the shared word list here instead would be forbidden, and would
# go stale the moment a word was added upstream.

[files]
extend-exclude = [
  # An Apple property list whose colour values are base64-encoded NSColor
  # archives. Inside that base64 sit two-letter runs like `OT` and `ND`
  # that typos reads as misspellings of `TO` and `AND`. They are not words
  # and there is nothing to correct: editing a byte changes the colour, or
  # corrupts the archive outright. The file is generated by Terminal.app
  # and reviewed as colour values, never as prose.
  "home/dot_config/terminal/terminal-pro.terminal",
]
