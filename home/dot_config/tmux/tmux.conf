# --- tmux: correctness only, no theming ---
#
# WHY THIS FILE HAS NO COLOURS IN IT. ai-dash puts the first terminal of
# the day inside tmux, so its defaults are lived with daily - but this
# repository also promises that your own tmux theming is never touched.
# Both hold only if the shipped file changes BEHAVIOUR and nothing else:
# every status, border and colour option here would be a global default
# fighting whatever you set. The dashboard's own Catppuccin styling is
# applied session-scoped by ai-dash, and session options outrank these
# globals, so the two cannot collide in either direction.
#
# XDG path: tmux 3.1 and newer read ~/.config/tmux/tmux.conf. Both
# shipped tmuxes are 3.4 or newer (brew current, Ubuntu 24.04 ships 3.4).
# A pre-existing ~/.tmux.conf still loads - tmux reads every default path
# that exists - and the backup captures this file's target before apply.

# History. The default of 2000 lines is about one `fastfetch` and a build
# log, and the dashboard's panes are exactly where you scroll back.
set -g history-limit 50000

# Mouse. Click between the four dashboard panes and wheel-scroll one
# without entering copy mode by hand. Native selection is not lost:
# hold Option (Terminal.app) or Shift (most others) to drag-select as
# though tmux were not there.
set -g mouse on

# Escape key latency. tmux waits this long to decide whether an ESC is a
# key or the start of an escape sequence, and the wait is visible as lag
# in any TUI running in a pane, including the model chat. Upstream
# reduced the 500ms default to 10ms in tmux 3.5, so this is a real fix on
# Ubuntu's 3.4 and a harmless restatement on current brew tmux.
set -s escape-time 10

# Let programs in a pane know when that pane gains or loses focus, which
# is how an editor reloads a file changed underneath it.
set -g focus-events on

# NO terminal-overrides / terminal-features RGB LINE, DELIBERATELY.
# tmux 3.2 and newer turn on 24-bit colour by themselves when the outer
# terminal advertises COLORTERM=truecolor, which VS Code, iTerm2 and
# Ghostty all do. Forcing '*:RGB' would also send 24-bit sequences to
# Terminal.app, which cannot render them - the one terminal this
# repository configures on macOS. Detection is strictly better here than
# assertion.
#
# default-terminal is likewise left alone: tmux-256color is the better
# entry, but its terminfo record only reached macOS's system database in
# Sonoma, and naming a terminal the host cannot describe costs every
# program in every pane far more than it gains.

# The escape hatch, mirroring ~/.zshrc.local: gitignored, absent by
# default, and the right home for machine-specific tmux settings. -q so a
# missing file is not an error.
source-file -q ~/.config/tmux/tmux.conf.local
