# --- Prove a bootstrap works on a machine nobody has ---
#
# THIS WORKFLOW IS THE ONLY PLACE macOS AND WINDOWS ARE EXERCISED AT ALL.
# The whole design was built and reasoned about on Linux, so on both of
# those platforms this is the first real test rather than a regression
# check. Treat a failure here as information, not as an inconvenience.
#
# WHAT "CLEAN MACHINE" CAN AND CANNOT MEAN HERE, stated so a green tick is
# not overread:
#
#   * Neither runner offers a disposable container, so isolation is a
#     throwaway $HOME and nothing more. Anything the bootstrap touches
#     outside $HOME is neither isolated nor clean.
#   * macos-latest ships Homebrew ALREADY INSTALLED, so a real `brew
#     install` here would prove nothing about a bare machine while costing
#     minutes. Package installation is therefore stubbed and asserted on
#     the planned list instead.
#   * Both runners are slow. Everything that does not need the real
#     operating system runs on the cheap Linux linter job first, so a
#     template typo fails in twenty seconds rather than six minutes.

name: '🚦 Bootstrap'

on:
  push:
    branches: ['Development', 'Experimental', 'Preview', 'Release']
  pull_request:
    branches: ['Development', 'Experimental', 'Preview', 'Release']
  # Weekly, because an install channel or an upstream release URL can die
  # on untouched code. This is the only thing that tells you before you are
  # standing at a new laptop.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # Asserted below to be the version actually on PATH. Without that check a
  # preinstalled or newer chezmoi silently changes what is being tested.
  CHEZMOI_VERSION: 'v2.71.1'
  CI_STUB: '1'

jobs:
  # The cheap job. Renders every template for every platform from a single
  # Linux host, because --override-data changes both template rendering and
  # .chezmoiignore evaluation. Not a supported target: a compiler.
  lint:
    name: '🧹 Lint & Render'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: '📂 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '📦 Install chezmoi'
        run: |
          set -euo pipefail
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t "${CHEZMOI_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: '🔍 Pinned chezmoi is the one on PATH'
        run: |
          set -euo pipefail
          got="$(chezmoi --version | head -1)"
          echo "${got}"
          case "${got}" in
            *"${CHEZMOI_VERSION#v}"*) echo "ok pinned version in use" ;;
            *) echo "::error::expected ${CHEZMOI_VERSION}, got ${got}"; exit 1 ;;
          esac

      - name: '🧹 ShellCheck'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          make lint-shell

      # The templates GENERATE shell that nothing used to read. A
      # rendering is what runs on a new machine, and under CI_STUB the
      # smoke test exits three lines into each one, so the real branch
      # reached a laptop having passed a green pipeline.
      - name: '🧹 ShellCheck the generated shell'
        run: make lint-shell-templates

      # Nothing checked the PowerShell until this step existed. It parses
      # the two bootstrap scripts, the profile, and the three Windows
      # provisioning templates AFTER rendering them, which is the only way
      # a syntax error in those is caught anywhere other than on a real
      # Windows machine. pwsh is preinstalled on the Ubuntu runner.
      - name: '🧹 PowerShell parses'
        run: make lint-powershell

      - name: '🌐 Every template renders for every platform'
        run: make render

      - name: '🛡️ No attribute prefix leaked into a target path'
        run: make prefixes

  bootstrap:
    name: '🚀 Bootstrap (${{ matrix.os }})'
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # One platform failing must not hide the state of the others.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    permissions:
      contents: read
    steps:
      - name: '📂 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '📦 Install chezmoi (POSIX)'
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t "${CHEZMOI_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: '📦 Install chezmoi (Windows)'
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $HOME '.local\bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          iex "&{$(irm 'https://get.chezmoi.io/ps1')} -b '$bin' -t '$env:CHEZMOI_VERSION'"
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      # Asserted rather than assumed. GitHub's Windows runners normally run
      # elevated, which is what lets chezmoi create symlinks at all, but a
      # runner image change would otherwise turn that into a silent,
      # confusing failure later.
      - name: '🔗 Windows can create symlinks'
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'symlink-probe'
          New-Item -ItemType Directory -Path $t -Force | Out-Null
          Set-Content -Path (Join-Path $t 'real.txt') -Value 'x'
          try {
            New-Item -ItemType SymbolicLink -Path (Join-Path $t 'link.txt') `
                     -Target (Join-Path $t 'real.txt') -ErrorAction Stop | Out-Null
            Write-Host 'ok symlink creation permitted'
          } catch {
            Write-Host '::warning::symlink creation NOT permitted on this runner'
          }

      # One smoke script on all three runners. Git Bash is present on the
      # Windows image, so `shell: bash` works there and there is no second
      # copy of the suite to drift out of step.
      - name: '🧪 Smoke test'
        shell: bash
        run: ./scripts/smoke-test.sh

      # THE SMOKE TEST NEVER RUNS THE ENTRY POINT. It drives chezmoi
      # directly, so install.sh and bootstrap.sh - argument parsing, the
      # pinned-release download and its checksum verification, stage
      # order, the key generation, the trap that prints the way back -
      # were the only untested code on the path a new machine actually
      # takes. This runs the real thing against a scratch HOME.
      - name: '🚀 The real entry point (POSIX)'
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"

          # PATH without the workflow's chezmoi, so ensure_chezmoi has to
          # fetch the pinned tarball and verify its checksum - the channel
          # a new laptop uses, and the one the weekly schedule exists to
          # watch. It was never exercised, because CI installs chezmoi
          # from the endpoint bootstrap.sh deliberately refuses.
          #
          # COMPUTED ON ITS OWN LINE, BEFORE HOME IS REASSIGNED. Written
          # as one command prefix (HOME=... PATH="$(... $HOME ...)"), bash
          # applies the earlier assignment to the later expansion, so
          # $HOME inside the substitution would already be the scratch
          # directory and the strip would match nothing - leaving the
          # runner's chezmoi on PATH and the download path untested,
          # passing vacuously. Verified in a shell before writing this.
          # -F -x so the entry is matched literally and whole.
          stripped="$(printf '%s\n' "$PATH" | tr ':' '\n' | grep -vFx "$HOME/.local/bin" | paste -sd: -)"
          test -n "${stripped}" || { echo '::error::stripped PATH is empty'; exit 1; }

          HOME="${scratch}" PATH="${stripped}" ./install.sh
          ls -d "${scratch}"/.dotfiles-backup-*/manifest.tsv >/dev/null \
            || { echo '::error::bootstrap produced no snapshot manifest'; exit 1; }
          test -f "${scratch}/.config/git/config" \
            || { echo '::error::bootstrap applied no git config'; exit 1; }
          echo 'ok  install.sh -> bootstrap.sh completed against a scratch HOME'

      # ZERO LINES OF THE SHIPPED POWERSHELL HAVE EVER RUN IN CI. The
      # Windows leg runs the POSIX suite under Git Bash, so bootstrap.ps1
      # and restore-backup.ps1 - the entire path a real Windows user
      # takes, including the targets.zip snapshot format - were only ever
      # parse-checked. This is the PowerShell mirror of the round trip.
      #
      # Stated so a green tick is not overread: the execution-policy and
      # profile-shim stages still touch the runner's real per-user state,
      # because known-folder paths do not follow USERPROFILE. Acceptable
      # on a throwaway runner, and the reason CI_STUB is set.
      - name: '🚀 The real entry point (Windows)'
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scratch = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          # Seed a victim file so the snapshot has something to archive
          # and the restore has something to prove.
          $victimDir = Join-Path $scratch '.config\git'
          New-Item -ItemType Directory -Path $victimDir -Force | Out-Null
          Set-Content -Path (Join-Path $victimDir 'config') -Value 'PRE-EXISTING USER CONTENT'

          $env:USERPROFILE = $scratch
          $env:HOME        = $scratch
          & pwsh -NoProfile -File scripts/bootstrap.ps1 -SkipPackages
          if ($LASTEXITCODE -ne 0) { throw "bootstrap.ps1 exited $LASTEXITCODE" }

          $backup = Get-ChildItem -Path $scratch -Filter '.dotfiles-backup-*' -Directory |
                    Select-Object -First 1
          if (-not $backup) { throw 'bootstrap.ps1 produced no snapshot' }
          if (-not (Test-Path (Join-Path $backup.FullName 'manifest.tsv'))) {
              throw 'snapshot has no manifest.tsv'
          }
          Write-Host "ok  bootstrap.ps1 completed, snapshot at $($backup.FullName)"

          & pwsh -NoProfile -File scripts/restore-backup.ps1 $backup.FullName
          if ($LASTEXITCODE -ne 0) { throw "restore-backup.ps1 exited $LASTEXITCODE" }
          $restored = Get-Content (Join-Path $victimDir 'config') -Raw
          if ($restored -notmatch 'PRE-EXISTING USER CONTENT') {
              throw 'restore did not put the original content back'
          }
          Write-Host 'ok  restore-backup.ps1 round trip verified'
